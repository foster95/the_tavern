{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Sign Out" %}{% endblock %}

{% block inner_content %}
<h2 class="logo-font mb-4 text-center">{% trans "Sign Out" %}</h2>
<hr>
<p class="text-center">{% trans 'Are you sure you want to sign out?' %}</p>

<form method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {% if redirect_field_value %}
  <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
  {% endif %}
  <div class="d-flex justify-content-center gap-3 mt-3"><a class="btn btn-dark text-white" href="{% url 'home' %}">Cancel</a>
  <button type="submit" class="btn">{% trans 'Sign Out' %}</button>
  </div>
</form>


{% endblock %}
