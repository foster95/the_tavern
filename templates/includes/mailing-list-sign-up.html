
<div class="footer-band pt-4 pb-3 mailer-sign-up">
  <div class="mailer-sign-up text-center">
  <h2 class="text-center">Join Our Party</h2>
<p class="mb-3 text-center">
  Subscribe to receive updates on new products, special offers, and exclusive content.
</p>

<form id="mc-subscribe-form" novalidate>
  <div class="d-flex justify-content-center">
    <div class="d-flex align-items-center gap-3 justify-content-center signup-row">

      <input
        id="mc-email"
        type="email"
        name="EMAIL"
        class="form-control signup-email"
        placeholder="Enter your email"
        required
      >

      <button
        id="mc-submit"
        type="submit"
        class="btn btn-primary subscribe-button"
      >
        Subscribe
      </button>

    </div>
  </div>

  <div id="mc-alert" class="mt-3 d-none"></div>
</form>
</div>
</div>
