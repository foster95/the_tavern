
<div class="pt-4 pb-3 mailer-sign-up">
  <div class="text-center">
  <h2 class="text-center">Join Our Party</h2>
<p class="mb-3 text-center">
  Subscribe to receive updates on new products, special offers, and exclusive content.
</p>

<form id="mc-subscribe-form" novalidate>
  <div class="d-flex justify-content-center">
    <div class="signup-row d-flex flex-column flex-sm-row align-items-center justify-content-center gap-3 px-3">

      <label for="site-search" class="visually-hidden">Join our Mailing List</label>
      <input
        id="mc-email"
        type="email"
        name="EMAIL"
        class="form-control signup-email"
        placeholder="Enter your email"
        aria-label="Email address"
        required
      >

      <button
        id="mc-submit"
        type="submit"
        class="btn btn-primary subscribe-button px-4"
      >
        Subscribe
      </button>

    </div>
  </div>

  <div id="mc-alert" class="mt-3 d-none"></div>
</form>
</div>
</div>
