<!-- MOBILE HEADER -->
<div class="d-md-none py-2" id="mobile-heading">
  <div class="px-3 d-flex align-items-center">

    <button class="navbar-toggler border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#main-nav"
        aria-controls="main-nav"
        aria-expanded="false"
        aria-label="Toggle navigation">
  <i class="fa-solid fa-bars fa-lg"></i>
</button>

    <!-- Mobile icons -->
 <ul class="list-inline mb-0 d-flex align-items-center justify-content-center flex-grow-1" id="mobile-icons">


      <!-- Search (NOW uses collapse, NOT dropdown) -->
      <li class="list-inline-item">
        <button class="nav-link p-0 bg-transparent border-0"
                type="button"
                id="mobile-search-toggle"
                data-bs-toggle="collapse"
                data-bs-target="#mobile-search-collapse"
                aria-expanded="false"
                aria-controls="mobile-search-collapse"
                aria-label="Search">
          <span class="text-center">
            <span><i class="fas fa-search fa-lg"></i></span>
            <small class="d-block">Search</small>
          </span>
        </button>
      </li>

      <!-- Account -->
      <li class="list-inline-item dropdown">
        <a class="nav-link p-0"
           href="#"
           id="mobile-account-toggle"
           data-bs-toggle="dropdown"
           aria-expanded="false"
           aria-label="My Account">
          <div class="text-center">
            <div><i class="fas fa-user fa-lg"></i></div>
            <small class="d-block">My Account</small>
          </div>
        </a>

        <div class="dropdown-menu dropdown-menu-end border-0 shadow rounded-3 mobile-dropdown">
          {% if request.user.is_authenticated %}
            {% if request.user.is_superuser %}
              <a href="{% url 'add_product' %}" class="dropdown-item">Product Management</a>
            {% endif %}
            <a href="{% url 'profile' %}" class="dropdown-item">My Profile</a>
            <a href="{% url 'account_logout' %}" class="dropdown-item">Sign Out</a>
          {% else %}
            <a href="{% url 'account_signup' %}" class="dropdown-item">Register</a>
            <a href="{% url 'account_login' %}" class="dropdown-item">Sign In</a>
          {% endif %}
        </div>
      </li>

      <!-- Bag -->
      <li class="list-inline-item">
        <a class="nav-link p-0" href="{% url 'view_bag' %}" aria-label="View bag">
          <div class="text-center">
            <div><i class="fas fa-shopping-bag fa-lg"></i></div>
            <small class="d-block">
              {% if grand_total %}
                £{{ grand_total|floatformat:2 }}
              {% else %}
                £0.00
              {% endif %}
            </small>
          </div>
        </a>
      </li>

    </ul>
  </div>
</div>
