{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mb-5">

  <!-- Page Title -->
  <div class="row">
    <div class="col text-center">
      <h1 class="display-4 mt-4">Product Management</h1>
      <h2>Amend a Product</h2>
      <hr class="w-100 mb-3">
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <form method="post"class="bg-light p-4 rounded-4 shadow-sm" action="{% url 'amend_product' product.slug %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form |crispy }}
        <button type="submit" class="btn btn-primary mt-3">Update Product</button>
        <button type="reset" class="btn btn-secondary mt-3">Reset</button>
        <a href="{% url 'products' %}" class="btn btn-outline-secondary mt-3">Cancel</a>
      </form>
    </div>
</div>
{% endblock %}
